<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Inter, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#172554"/></marker></defs>
<rect width="1200" height="440" fill="#fff"/><text x="600" y="34" font-size="19" font-weight="800" fill="#172554" text-anchor="middle"><tspan x="600" dy="0">A jogosultság szintről szintre bővül: mindenki megkapja az alatta lévők jogait</tspan></text><rect x="20" y="80" width="270" height="340" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><rect x="20" y="80" width="270" height="64" rx="12" fill="#64748b"/><rect x="20" y="120" width="270" height="24" fill="#64748b"/><text x="155" y="110" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="155" dy="0">Diák</tspan></text><text x="155" y="134" font-size="13.5" font-weight="500" fill="#fff" text-anchor="middle"><tspan x="155" dy="0">az adatbázisban nincs szerepkör</tspan></text><text x="38" y="180" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="38" dy="0">• Bejelentést küld</tspan></text><text x="38" y="214" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="38" dy="0">• Követőkóddal nézi az</tspan><tspan x="38" dy="20">   állapotot</tspan></text><text x="38" y="268" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="38" dy="0">• Saját adatait letölti,</tspan><tspan x="38" dy="20">   adatkezelési kérelmet ad be</tspan></text><circle cx="302" cy="112" r="14" fill="#fff" stroke="#172554" stroke-width="2.5"/><text x="302" y="119" font-size="22" font-weight="800" fill="#172554" text-anchor="middle"><tspan x="302" dy="0">+</tspan></text><rect x="315" y="80" width="270" height="340" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><rect x="315" y="80" width="270" height="64" rx="12" fill="#2563eb"/><rect x="315" y="120" width="270" height="24" fill="#2563eb"/><text x="450" y="110" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="450" dy="0">Tanár</tspan></text><text x="450" y="134" font-size="13.5" font-weight="500" fill="#fff" text-anchor="middle"><tspan x="450" dy="0">szerepkör: approver</tspan></text><text x="333" y="176" font-size="15" font-weight="800" fill="#172554" text-anchor="start"><tspan x="333" dy="0">+ Diák jogai</tspan></text><text x="333" y="216" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="333" dy="0">• Regisztrációt hagy jóvá vagy</tspan><tspan x="333" dy="20">   utasít el</tspan></text><text x="333" y="270" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="333" dy="0">• Nevet javít</tspan></text><circle cx="597" cy="112" r="14" fill="#fff" stroke="#172554" stroke-width="2.5"/><text x="597" y="119" font-size="22" font-weight="800" fill="#172554" text-anchor="middle"><tspan x="597" dy="0">+</tspan></text><rect x="610" y="80" width="270" height="340" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><rect x="610" y="80" width="270" height="64" rx="12" fill="#16a34a"/><rect x="610" y="120" width="270" height="24" fill="#16a34a"/><text x="745" y="110" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="745" dy="0">Karbantartó</tspan></text><text x="745" y="134" font-size="13.5" font-weight="500" fill="#fff" text-anchor="middle"><tspan x="745" dy="0">szerepkör: maintainer</tspan></text><text x="628" y="176" font-size="15" font-weight="800" fill="#172554" text-anchor="start"><tspan x="628" dy="0">+ Tanár jogai</tspan></text><text x="628" y="216" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="628" dy="0">• Bejelentéseket lát és kezel</tspan><tspan x="628" dy="20">   (név, fénykép)</tspan></text><text x="628" y="270" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="628" dy="0">• Státuszt és megjegyzést ad</tspan></text><text x="628" y="304" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="628" dy="0">• Termeket és eszközöket kezel</tspan></text><circle cx="892" cy="112" r="14" fill="#fff" stroke="#172554" stroke-width="2.5"/><text x="892" y="119" font-size="22" font-weight="800" fill="#172554" text-anchor="middle"><tspan x="892" dy="0">+</tspan></text><rect x="905" y="80" width="270" height="340" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="3"/><rect x="905" y="80" width="270" height="64" rx="12" fill="#f97316"/><rect x="905" y="120" width="270" height="24" fill="#f97316"/><text x="1040" y="110" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1040" dy="0">Igazgató és admin</tspan></text><text x="1040" y="134" font-size="13.5" font-weight="500" fill="#fff" text-anchor="middle"><tspan x="1040" dy="0">szerepkör: operator</tspan></text><text x="923" y="176" font-size="15" font-weight="800" fill="#172554" text-anchor="start"><tspan x="923" dy="0">+ Karbantartó jogai</tspan></text><text x="923" y="216" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="923" dy="0">• Szerepköröket oszt</tspan></text><text x="923" y="250" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="923" dy="0">• Adatkezelési kérelmeket kezel</tspan></text><text x="923" y="284" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="923" dy="0">• Fiókot töröl és anonimizál</tspan></text><text x="923" y="318" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="923" dy="0">• Adatmentést tölt le</tspan></text></svg>