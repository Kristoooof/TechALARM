 dy="0">profiles</tspan></text><text x="654" y="92" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="start"><tspan x="654" dy="0">PK/FK id → auth.users</tspan></text><text x="654" y="116" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="654" dy="0">full_name, name_key, username (egyedi)</tspan></text><text x="654" y="140" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="654" dy="0">status: pending, approved, rejected</tspan></text><text x="654" y="164" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="654" dy="0">login_email (belső), notice_version</tspan></text><text x="654" y="188" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="654" dy="0">notice_accepted_at, created_at, decided_at</tspan></text><rect x="20" y="330" width="270" height="92" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2.2"/><rect x="20" y="330" width="270" height="36" rx="12" fill="#16a34a"/><rect x="20" y="350" width="270" height="16" fill="#16a34a"/><text x="155" y="356" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="155" dy="0">rooms</tspan></text><text x="34" y="392" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="start"><tspan x="34" dy="0">PK id</tspan></text><text x="34" y="416" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="34" dy="0">name, sort_order, active</tspan></text><rect x="20" y="480" width="270" height="116" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2.2"/><rect x="20" y="480" width="270" height="36" rx="12" fill="#16a34a"/><rect x="20" y="500" width="270" height="16" fill="#16a34a"/><text x="155" y="506" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="155" dy="0">devices</tspan></text><text x="34" y="542" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="start"><tspan x="34" dy="0">PK id</tspan></text><text x="34"