<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1370" width="1200" height="1370" font-family="Inter, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#172554"/></marker></defs>
<rect width="1200" height="1370" fill="#fff"/><rect x="0" y="0" width="400" height="1370" fill="#eff6ff"/><rect x="0" y="0" width="400" height="56" fill="#172554"/><text x="200" y="35" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="200" dy="0">Felhasználó (diák, tanár)</tspan></text><rect x="400" y="0" width="400" height="1370" fill="#f8fafc"/><rect x="400" y="0" width="400" height="56" fill="#172554"/><text x="600" y="35" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="600" dy="0">Rendszer (Next.js, Supabase)</tspan></text><rect x="800" y="0" width="400" height="1370" fill="#eff6ff"/><rect x="800" y="0" width="400" height="56" fill="#172554"/><text x="1000" y="35" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1000" dy="0">Munkatárs (jóváhagyó, karbantartó)</tspan></text><line x1="400" y1="56" x2="400" y2="1370" stroke="#cbd5e1" stroke-width="2"/><line x1="800" y1="56" x2="800" y2="1370" stroke="#cbd5e1" stroke-width="2"/><rect x="30" y="90" width="340" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="56" cy="116" r="17" fill="#2563eb"/><text x="56" y="122" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="56" dy="0">1</tspan></text><text x="86" y="121" font-size="17" font-weight="800" fill="#172554" text-anchor="start"><tspan x="86" dy="0">Regisztráció</tspan></text><text x="48" y="150" font-size="14.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="48" dy="0">Név, jelszó, a tájékoztató</tspan><tspan x="48" dy="19">tudomásulvétele</tspan></text><rect x="430" y="90" width="340" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="456" cy="116" r="17" fill="#2563eb"/><text x="456" y="122" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="456" dy="0">2</tspan></text><text x="486" y="121" font-size="17" font-weight="800" fill="#172554" text-anchor="start"><tspan x="486" dy="0">Feldolgozás</tspan></text><text x="448" y="150" font-size="14.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="448" dy="0">Turnstile, név- és jelszó-</tspan><tspan x="448" dy="19">ellenőrzés, egyedi felhasználónév,</tspan><tspan x="448" dy="19">profil (váró), automatikus belépés</tspan></text><path d="M370 145 L430 145" fill="none" stroke="#172554" stroke-width="2.5" marker-end="url(#ar)"/><rect x="30" y="270" width="340" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="56" cy="296" r="17" fill="#2563eb"/><text x="56" y="302" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="56" dy="0">3</tspan></text><text x="86" y="301" font-size="17" font-weight="800" fill="#172554" text-anchor="start"><tspan x="86" dy="0">Bejelentés kitöltése</tspan></text><text x="48" y="330" font-size="14.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="48" dy="0">Terem típusa és száma, eszköz,</tspan><tspan x="48" dy="19">probléma, leírás, fénykép</tspan></text><path d="M600 220 L600 245 L200 245 L200 270" fill="none" stroke="#172554" stroke-width="2.5" marker-end="url(#ar)"/><polygon points="600,392 775,470 600,548 425,470" fill="#fff" stroke="#f97316" stroke-width="2.5"/><text x="600" y="448" font-size="14.5" font-weight="700" fill="#172554" text-anchor="middle"><tspan x="600" dy="0">4. Ellenőrzés a szerveren:</tspan><tspan x="600" dy="19">belépve? nem elutasított?</tspan><tspan x="600" dy="19">korlát? fotó rendben?</tspan></text><path d="M370 325 L400 325 L400 360 L600 360 L600 392" fill="none" stroke="#172554" stroke-width="2.5" marker-end="url(#ar)"/><rect x="30" y="440" width="340" height="100" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="200" y="472" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle"><tspan x="200" dy="0">Hibaüzenet:</tspan><tspan x="200" dy="20">a felhasználó javít, és újra küld</tspan></text><path d="M425 470 L370 490" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#ar)"/><rect x="378.2" y="455" width="39.599999999999994" height="24" rx="6" fill="#fff"/><text x="398" y="473" font-size="15" font-weight="700" fill="#f97316" text-anchor="middle"><tspan x="398" dy="0">nem</tspan></text><path d="M200 440 L200 380" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#ar)"/><rect x="430" y="590" width="340" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><circle cx="456" cy="616" r="17" fill="#16a34a"/><text x="456" y="622" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="456" dy="0">5</tspan></text><text x="486" y="621" font-size="17" font-weight="800" fill="#172554" text-anchor="start"><tspan x="486" dy="0">Mentés</tspan></text><text x="448" y="650" font-size="14.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="448" dy="0">Bejelentés és fénykép (privát</tspan><tspan x="448" dy="19">tároló), követőkód. Váró felhasználó</tspan><tspan x="448" dy="19">bejelentése: hitelesítetlen</tspan></text><path d="M600 548 L600 590" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ar)"/><rect x="605.6" y="556" width="48.8" height="24" rx="6" fill="#fff"/><text x="630" y="574" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle"><tspan x="630" dy="0">igen</tspan></text><rect x="830" y="590" width="340" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="856" cy="616" r="17" fill="#2563eb"/><text x="856" y="622" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="856" dy="0">6</tspan></text><text x="886" y="621" font-size="17" font-weight="800" fill="#172554" text-anchor="start"><tspan x="886" dy="0">Jóváhagyás</tspan></text><text x="848" y="650" font-size="14.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="848" dy="0">A munkatárs a Regisztrációk</tspan><tspan x="848" dy="19">oldalon jóváhagyja vagy</tspan><tspan x="848" dy="19">elutasítja a regisztrációt</tspan></text><path d="M770 660 L830 660" fill="none" stroke="#172554" stroke-width="2.5" marker-end="url(#ar)"/><rect x="771" y="647" width="58" height="24" rx="6" fill="#fff"/><text x="800" y="665" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle"><tspan x="800" dy="0">látja</tspan></text><rect x="430" y="790" width="340" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><circle cx="456" cy="816" r="17" fill="#16a34a"/><text x="456" y="822" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="456" dy="0">7</tspan></text><text x="486" y="821" font-size="17" font-weight="800" fill="#172554" text-anchor="start"><tspan x="486" dy="0">Hitelesítés</tspan></text><text x="448" y="850" font-size="14.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="448" dy="0">Adatbázis trigger: a felhasználó</tspan><tspan x="448" dy="19">bejelentései hitelesítetté (jóváhagyás)</tspan><tspan x="448" dy="19">vagy hitelesítetlenné (elutasítás) válnak</tspan></text><path d="M1000 730 L1000 850 L770 850" fill="none" stroke="#172554" stroke-width="2.5" marker-end="url(#ar)"/><rect x="830" y="960" width="340" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="856" cy="986" r="17" fill="#2563eb"/><text x="856" y="992" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="856" dy="0">8</tspan></text><text x="886" y="991" font-size="17" font-weight="800" fill="#172554" text-anchor="start"><tspan x="886" dy="0">Kezelés</tspan></text><text x="848" y="1020" font-size="14.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="848" dy="0">Karbantartó: státusz (új, folyamatban,</tspan><tspan x="848" dy="19">megjavítva, elutasítva) és megjegyzés</tspan><tspan x="848" dy="19">a bejelentéshez</tspan></text><path d="M600 910 L600 1025 L830 1025" fill="none" stroke="#172554" stroke-width="2.5" marker-end="url(#ar)"/><rect x="30" y="1160" width="340" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="56" cy="1186" r="17" fill="#2563eb"/><text x="56" y="1192" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="56" dy="0">9</tspan></text><text x="86" y="1191" font-size="17" font-weight="800" fill="#172554" text-anchor="start"><tspan x="86" dy="0">Követés</tspan></text><text x="48" y="1220" font-size="14.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="48" dy="0">Az Állapot oldalon a követőkóddal</tspan><tspan x="48" dy="19">látja a státuszt és a karbantartó</tspan><tspan x="48" dy="19">üzenetét</tspan></text><path d="M1000 1090 L1000 1125 L200 1125 L200 1160" fill="none" stroke="#172554" stroke-width="2.5" marker-end="url(#ar)"/><rect x="952.6" y="1094.5" width="94.8" height="24" rx="6" fill="#fff"/><text x="1000" y="1112.5" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle"><tspan x="1000" dy="0">követőkód</tspan></text><rect x="430" y="1160" width="340" height="140" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><circle cx="456" cy="1186" r="17" fill="#64748b"/><text x="456" y="1192" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="456" dy="0">10</tspan></text><text x="486" y="1191" font-size="17" font-weight="800" fill="#172554" text-anchor="start"><tspan x="486" dy="0">Törlés</tspan></text><text x="448" y="1220" font-size="14.5" font-weight="500" fill="#0f172a" text-anchor="start"><tspan x="448" dy="0">Megőrzési idő (tanév vége + 1 év)</tspan><tspan x="448" dy="19">után napi feladat törli. Fióktörlésnél</tspan><tspan x="448" dy="19">a bejelentések névtelenné válnak</tspan></text><path d="M370 1225 L430 1225" fill="none" stroke="#172554" stroke-width="2.5" marker-end="url(#ar)"/></svg>